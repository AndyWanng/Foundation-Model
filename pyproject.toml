[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-pet-geomc"
version = "0.1.0"
description = "Shared-SAT3D GeoMC pipeline with formal resumable MRI/PET pretraining"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "PyYAML==6.0.3",
  "nibabel==5.3.2",
  "indexed-gzip==1.10.1",
  "psutil==7.1.3",
  "einops==0.8.2",
  "timm==1.0.28",
  "filelock==3.20.0",
  "rich==14.1.0",
  "pydicom==3.0.1",
  "SimpleITK==2.5.2",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[project.scripts]
mri-pet-geomc = "mri_pet_geomc.cli:main"
foundation-preprocess = "mri_pet_geomc.formal.cli:preprocess_main"
foundation-train = "mri_pet_geomc.formal.cli:train_main"
foundation-inspect = "mri_pet_geomc.formal.cli:inspect_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
